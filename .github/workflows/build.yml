name: Build APK

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Restore signing key
        if: ${{ env.FT_KEYSTORE_BASE64 != '' }}
        env:
          FT_KEYSTORE_BASE64: ${{ secrets.FT_KEYSTORE_BASE64 }}
        run: echo "$FT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ft-mine.jks"

      - name: Build release APK
        env:
          FT_KEYSTORE_BASE64: ${{ secrets.FT_KEYSTORE_BASE64 }}
          FT_KEYSTORE_PASSWORD: ${{ secrets.FT_KEYSTORE_PASSWORD }}
          FT_KEY_PASSWORD: ${{ secrets.FT_KEYSTORE_PASSWORD }}
          FT_KEY_ALIAS: ft
        run: |
          if [ -n "$FT_KEYSTORE_BASE64" ]; then export FT_KEYSTORE_FILE="$RUNNER_TEMP/ft-mine.jks"; fi
          ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ft-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
